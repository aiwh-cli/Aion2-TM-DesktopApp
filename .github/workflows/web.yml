name: Browser checks
on:
  push:
    branches: [web-version]
    paths: ['web/**', 'scripts/browser-smoke.mjs', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'vercel.json', '.npmrc', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'scripts/browser-smoke.mjs', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'vercel.json', '.npmrc', '.github/workflows/web.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
